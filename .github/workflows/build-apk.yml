name: 🚀 Build Cloud Unzipper Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions web page

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: 🔧 Grant Execute Permission for Gradlew (if present)
        run: |
          cd android-app
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudUnzipper-Debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
